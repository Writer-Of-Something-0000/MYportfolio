
<article id="Article-fifth">
             <h2 id="title">Selected Works   <i class="fa-solid fa-fire"></i></h2>

             <div id="video-container" #slider
                  (pointerdown)="dragStart($event)"
                  (pointermove)="dragMove($event)"
                  (pointerup)="dragEnd()"
                  (pointerleave)="dragEnd()">
              <div class="video" *ngFor="let work of works">
                <div class="video-player" (click)="play(work)">

                  <iframe
                    *ngIf="playingId === work.youtubeId"
                    [src]="embedUrl"
                    [title]="work.title"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
                  </iframe>

                  <ng-container *ngIf="playingId !== work.youtubeId">
                    <img [src]="thumb(work.youtubeId)" [alt]="work.title" draggable="false">
                    <button type="button"><i class="fa-solid fa-play"></i></button>
                  </ng-container>

                </div>
                <h4 class="headline">{{ work.title }}</h4>
                <ul class="tags">
                  <li *ngFor="let tag of work.tags" [class.newskill]="tag.toLowerCase() === 'newskill'">#{{ tag }}</li>
                </ul>
              </div>
             </div>

</article>
