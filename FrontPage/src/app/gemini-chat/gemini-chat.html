<!-- floating CTAs, bottom-right: section teasers + Feedbacks (mobile) + Catch UP -->
<div class="teasers" *ngIf="(teasersVisible || showFeedbacksBtn || (showCatchUp && !atFooter)) && !open && !inputFocused">
  <ng-container *ngIf="teasersVisible">
    <button
      type="button"
      class="teaser"
      *ngFor="let t of shownTeasers; let i = index"
      [style.animation-delay.ms]="i * 90"
      (click)="tapTeaser(t)">
      {{ t.label }}
    </button>
  </ng-container>

  <!-- mobile-only: the on-page feedback section is hidden on phones, so surface it here -->
  <button *ngIf="showFeedbacksBtn" type="button" class="teaser feedbacks" (click)="showFeedbacks()">
    Feedbacks
  </button>

  <!-- Catch UP sticks right above the FAB, but never at the footer (the contact form is already there) -->
  <button *ngIf="showCatchUp && !atFooter" type="button" class="teaser catch-up" (click)="catchUp()">
    Catch UP
  </button>
</div>

<div class="chat-panel" *ngIf="open">

  <div class="chat-head">
    <span class="title"><i class="fa-solid fa-wand-magic-sparkles"></i> Ask me anything about Luka</span>
    <button class="close" (click)="toggle()" aria-label="Close chat">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="chat-messages" #scroll>
    <div class="msg model" *ngIf="!messages.length">
      Hi! 👋 I’m Luka’s assistant. Ask me about his work, skills, or experience.
    </div>

    <div
      class="msg"
      *ngFor="let m of messages"
      [class.user]="m.role === 'user'"
      [class.model]="m.role === 'model'"
      [class.has-cards]="m.cards?.length || m.feedbacks?.length">
      {{ m.text }}

      <div class="social-cards" *ngIf="m.cards?.length">
        <a
          class="social-card"
          *ngFor="let c of m.cards"
          [href]="c.href"
          target="_blank"
          rel="noopener"
          [attr.aria-label]="c.label">
          <i [class]="c.icon"></i>
          <span>{{ c.label }}</span>
        </a>
      </div>

      <div class="fb-block" *ngIf="m.feedbacks?.length">
        <h4 class="fb-heading">Feadback's</h4>
        <div class="fb-item" *ngFor="let f of m.feedbacks">
          <h5 class="fb-name">{{ f.name }}</h5>
          <label class="fb-role" *ngIf="f.role">{{ f.role }}</label>
          <div class="fb-stars">
            <i
              *ngFor="let s of [0, 1, 2, 3, 4]"
              class="fa-star"
              [ngClass]="s < f.stars ? 'fa-solid' : 'fa-regular'"></i>
          </div>
          <p class="fb-text">{{ f.text }}</p>
        </div>
      </div>
    </div>

    <div class="msg model typing" *ngIf="sending">
      <span></span><span></span><span></span>
    </div>

    <!-- preset quick-question chips -->
    <div class="chip-row" *ngIf="!sending && !contactPending">
      <button type="button" class="chip" *ngFor="let s of suggestions" (click)="pick(s)">
        {{ s.label }}
      </button>
    </div>
  </div>

  <form class="chat-composer" (submit)="$event.preventDefault(); send(msgInput)">
    <input
      #msgInput
      type="text"
      placeholder="Type a message…"
      autocomplete="off"
      [disabled]="sending || contactPending" />
    <button type="submit" [disabled]="sending || contactPending" aria-label="Send message">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </form>

</div>
