<!-- floating round launcher, bottom-right -->
<button
  class="chat-fab"
  [class.hidden]="open"
  (click)="toggle()"
  aria-label="Chat with Luka">
  <span class="fab-avatar">
    <img src="/profileIMGearpods.png" alt="Luka" />
    <span class="fab-dot"></span>
  </span>
  <span class="fab-label">Ask me</span>
</button>

<div class="chat-panel" *ngIf="open">

  <div class="chat-head">
    <span class="title"><i class="fa-solid fa-wand-magic-sparkles"></i> Ask me anything about Luka</span>
    <button class="close" (click)="toggle()" aria-label="Close chat">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="chat-messages" #scroll>
    <div class="msg model" *ngIf="!messages.length">
      Hi! 👋 I’m Luka’s assistant. Ask me about his work, skills, or experience.
    </div>

    <div
      class="msg"
      *ngFor="let m of messages"
      [class.user]="m.role === 'user'"
      [class.model]="m.role === 'model'"
      [class.has-cards]="m.cards?.length">
      {{ m.text }}

      <div class="social-cards" *ngIf="m.cards?.length">
        <a
          class="social-card"
          *ngFor="let c of m.cards"
          [href]="c.href"
          target="_blank"
          rel="noopener"
          [attr.aria-label]="c.label">
          <i [class]="c.icon"></i>
          <span>{{ c.label }}</span>
        </a>
      </div>
    </div>

    <div class="msg model typing" *ngIf="sending">
      <span></span><span></span><span></span>
    </div>

    <!-- preset quick-question chips -->
    <div class="chip-row" *ngIf="!sending && !contactPending">
      <button type="button" class="chip" *ngFor="let s of suggestions" (click)="pick(s)">
        {{ s.label }}
      </button>
    </div>
  </div>

  <form class="chat-composer" (submit)="$event.preventDefault(); send(msgInput)">
    <input
      #msgInput
      type="text"
      placeholder="Type a message…"
      autocomplete="off"
      [disabled]="sending || contactPending" />
    <button type="submit" [disabled]="sending || contactPending" aria-label="Send message">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </form>

</div>
