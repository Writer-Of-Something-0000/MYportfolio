<section>

<article id="middle">
    <h1>Catch UP</h1>
    <form (submit)="send($event, who, channel, msg)">
        <div id="inputs">
                <label>Who’s Reaching Out</label>
                    <label>Contact Channel</label>
            <input #who type="text" name="name" placeholder="Giorgi · Tech Lead">
                <input #channel type="text" name="email" placeholder="Example@gmail.com">
            </div>
       <div id="text">
                            <label>Context & Intent</label>
        <textarea #msg name="message" rows="8"
        placeholder="Why you’re
reaching out
and how we can work together."></textarea>
       </div>

        <button type="submit" [disabled]="sending">{{ buttonText }}</button>
    </form>
</article>
</section>

<div id="last-info">
    <label >Developed by luka gengashvili</label>
    <label>© 2026 All Rights Reserved</label>
</div>
