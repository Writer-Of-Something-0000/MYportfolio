<section>

  <div id="filters" *ngIf="!loading && videos.length">

    <label class="sort-field">
      <span>Sort by</span>
      <select [value]="sortOrder" (change)="setSort($any($event.target).value)">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
      </select>
    </label>

    <div class="switch-group">
      <div class="ratio-switch" role="group" aria-label="Category">
        <button
          type="button"
          [class.active]="category === 'all'"
          (click)="setCategory('all')">Video Storytelling</button>
        <button
          type="button"
          [class.active]="category === 'graphicdesign'"
          (click)="setCategory('graphicdesign')">Graphic Design</button>
      </div>

      <div class="ratio-switch" role="group" aria-label="Aspect ratio">
        <button
          type="button"
          [class.active]="orientation === '169'"
          (click)="setOrientation('169')">16:9</button>
        <button
          type="button"
          [class.active]="orientation === '916'"
          (click)="setOrientation('916')">9:16</button>
      </div>

      <div class="ratio-switch" role="group" aria-label="Video length">
        <button
          type="button"
          [class.active]="!length"
          (click)="setLength(null)">All</button>
        <button
          type="button"
          [class.active]="length === 'long'"
          (click)="setLength('long')">Long</button>
        <button
          type="button"
          [class.active]="length === 'short'"
          (click)="setLength('short')">Shorts</button>
      </div>
    </div>

  </div>

  <p class="state" *ngIf="loading">Loading videos…</p>
  <p class="state" *ngIf="!loading && !videos.length">New videos are on the way 🎬</p>
  <p class="state" *ngIf="!loading && videos.length && !visibleVideos.length">
    No {{ category === 'graphicdesign' ? 'graphic design ' : '' }}{{ orientation === '916' ? '9:16' : '16:9' }}
    {{ length === 'short' ? 'shorts' : length === 'long' ? 'long videos' : 'videos' }} yet 🎬
  </p>

  <div id="video-container" [class.vertical]="orientation === '916'">
    <div class="video" *ngFor="let video of visibleVideos">
      <div class="video-player" (click)="play(video)">

        <iframe
          *ngIf="playingId === video.id"
          [src]="embedUrl"
          [title]="video.title"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>

        <ng-container *ngIf="playingId !== video.id">
          <img [src]="video.thumbnail" [alt]="video.title">
          <button type="button"><i class="fa-solid fa-play"></i></button>
        </ng-container>

      </div>
      <h4 class="headline">{{ video.title }}</h4>
      <ul class="tags">
        <li *ngFor="let tag of video.tags" [class.newskill]="tag.toLowerCase() === 'newskill'">#{{ tag }}</li>
      </ul>
    </div>
  </div>

</section>
