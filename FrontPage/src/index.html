<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FrontPage</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link class="icon" rel="icon" type="image/x-icon" href="profileIMG.jpg">
  <!-- hero background: preload the poster + the right-sized video BEFORE Angular
       boots, so the background appears instantly instead of black → grey → video.
       hero.ts reads window.__bgVideoSrc so the <video> uses the same file. -->
  <link rel="preload" as="image" href="/portfolio-poster.jpg" fetchpriority="high">
  <script>
    (function () {
      // the .webm files are AV1-encoded — Safari can't decode AV1, so it must get
      // the H.264 .mp4 tiers instead (the generic 'video/webm' check is NOT enough:
      // Safari says "maybe" to it, picks the webm, fails on AV1 and never falls back)
      var av1 = document.createElement('video').canPlayType('video/webm; codecs="av01.0.08M.08"');
      var files = av1
        ? { full: '/portfolio.webm', mid: '/smallsizeportfolio.webm', low: '/smallestportfolio.webm' }
        : { full: '/portfolio.mp4',  mid: '/smallsizeportfolio.mp4',  low: '/smallestportfolio.mp4' };
      var src = files.full;
      var c = navigator.connection || {};
      var t = c.effectiveType || '';
      if (c.saveData || /(^|-)2g$/.test(t)) src = files.low;
      else if (t === '3g') src = files.mid;
      window.__bgVideoSrc = src;
      // <link rel="preload" as="video"> is ignored by Chrome, so buffer through a
      // detached muted video element instead — the real <video> then plays from cache.
      var pv = document.createElement('video');
      pv.muted = true;
      pv.preload = 'auto';
      pv.src = src;
      pv.load();
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <app-root></app-root>
</body>
</html>
